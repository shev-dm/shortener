services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/links?sslmode=disable
      SHORTENER_URL: http://web-service:8081
      BASE_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started

  web-service:
    build: ./shortener

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: links
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d links"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  db_data:
